<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Spin Wheel</h1>
        <form id="inputForm">
            <label for="numParticipants">Number of Participants (2-15):</label>
            <input type="number" id="numParticipants" name="numParticipants" min="2" max="15" required>
            <button type="button" onclick="generateInputs()">Generate Inputs</button>
            <div id="participantsInputs"></div>
            <button type="button" onclick="createWheel()">Create Wheel</button>
        </form>
        <div class="wheel-container">
            <canvas id="wheelCanvas" width="500" height="500"></canvas>
            <div class="arrow"></div>
            <button id="spinButton" onclick="spinWheel()">Spin</button>
        </div>
        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
